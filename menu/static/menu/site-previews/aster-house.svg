<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"><defs><linearGradient id="shade" x1="0" x2="1"><stop offset="0" stop-color="#101915" stop-opacity=".1"/><stop offset="1" stop-color="#101915" stop-opacity=".82"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#f7c85d" stroke-opacity=".08"/></pattern></defs><image href="aster-salmon.jpg" x="0" y="0" width="720" height="420" preserveAspectRatio="xMidYMid slice"/><rect width="720" height="420" fill="url(#shade)"/><rect x="42" y="36" width="636" height="2" fill="#fff" opacity=".2"/><text x="650" y="78" text-anchor="end" font-family="Tahoma,Arial,sans-serif" font-size="24" font-weight="800" fill="#fff" letter-spacing="1">ASTER HOUSE</text><text x="650" y="121" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" opacity=".72">آشپزخانه و کافه شبانه</text><text x="650" y="190" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-size="42" font-weight="800" fill="#fff">طعم خوب،</text><text x="650" y="247" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-size="37" font-weight="800" fill="#fff">وقت آرام.</text><text x="650" y="320" text-anchor="end" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma,Arial,sans-serif" font-size="16" fill="#fff" opacity=".82">منو با فصل‌ها تغییر می‌کند، نه با قانون‌ها.</text><rect x="503" y="352" width="147" height="40" rx="20" fill="#f7c85d"/><text x="576" y="378" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">دیدن منو</text></svg>