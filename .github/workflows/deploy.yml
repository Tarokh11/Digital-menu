name: Deploy to production

on:
  push:
    branches:
      - main
      - fastfood_talia
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: Branch to deploy to the live site
        required: true
        type: choice
        options:
          - main
          - fastfood_talia
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: digital-menu

    steps:
      - name: Validate deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          for variable in SERVER_HOST SERVER_USER SERVER_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!variable}" ]; then
              printf 'Missing required deployment value: %s\n' "$variable" >&2
              exit 1
            fi
          done
          if ! printf '%s' "$SERVER_SSH_KEY" | grep -q 'PRIVATE KEY'; then
            printf 'SERVER_SSH_KEY must contain an OpenSSH private key, not a public key.\n' >&2
            exit 1
          fi

      - name: Load deployment SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server host key
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          set -eu
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -H -T 10 -p "$SERVER_PORT" "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy over SSH
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ inputs.deploy_branch || github.ref_name }}
          REPOSITORY: https://github.com/Tarokh11/Digital-menu.git
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -eu
          while [[ "$DEPLOY_PATH" == *$'\n' || "$DEPLOY_PATH" == *$'\r' ]]; do
            DEPLOY_PATH="${DEPLOY_PATH%?}"
          done
          printf -v remote_path '%q' "$DEPLOY_PATH"
          printf -v remote_branch '%q' "$DEPLOY_BRANCH"
          printf -v remote_repository '%q' "$REPOSITORY"
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH=$remote_path DEPLOY_BRANCH=$remote_branch REPOSITORY=$remote_repository bash -se" <<'REMOTE'
          set -eu
          case "$DEPLOY_BRANCH" in
            main|fastfood_talia) ;;
            *) printf 'Refusing to deploy unsupported branch: %s\n' "$DEPLOY_BRANCH" >&2; exit 1 ;;
          esac
          cd "$DEPLOY_PATH"
          if [ ! -e .git ]; then
            git init
          fi
          if ! git remote get-url origin >/dev/null 2>&1; then
            git remote add origin "$REPOSITORY"
          fi
          git remote set-url origin "$REPOSITORY"
          git fetch --prune origin "+refs/heads/$DEPLOY_BRANCH:refs/remotes/origin/$DEPLOY_BRANCH"
          git checkout -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
          docker compose build --pull=false web
          docker compose run --rm web python manage.py test </dev/null
          docker compose up -d --force-recreate --no-build --no-deps web
          docker compose exec -T web python manage.py check --deploy </dev/null
          docker compose exec -T web python -c 'from urllib.request import urlopen; response = urlopen("http://127.0.0.1:8000/"); body = response.read().decode(); assert response.status == 200 and "destination-card" in body; print("Homepage smoke check passed (HTTP 200, directory cards present).")' </dev/null
          docker compose ps
          REMOTE
