{% extends "layouts/base.html" %}
{% load static %}
{% block content %}
<main class="landing-page">
  <section class="landing-hero" aria-labelledby="landing-title">
    <div class="landing-art" aria-hidden="true"></div>
    <div class="landing-content">
      <div class="landing-brand" aria-label="Vita Juice Bar">
        <span class="landing-fruit">●</span>
        <strong>vita</strong>
      </div>
      <p class="landing-kicker">تازه، طبیعی، هر روز</p>
      <h1 id="landing-title">طعم تازه هر روز</h1>
      <p class="landing-description">آبمیوه‌های طبیعی، تازه و خوشحال‌کننده</p>
      <span class="landing-accent" aria-hidden="true"></span>
    </div>
    <a class="menu-cta" href="{% url 'menu' %}">
      <span>مشاهده منو</span>
      <span class="menu-cta-arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M5 12h14m-6-6 6 6-6 6" /></svg>
      </span>
    </a>
  </section>
</main>
{% endblock %}
