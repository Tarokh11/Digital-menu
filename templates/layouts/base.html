{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff9a22">
  <meta name="description" content="{{ page_description|default:'منوی آبمیوه‌ها و نوشیدنی‌های تازه' }}">
  <title>{{ shop_name }}</title>

<body class="{% block body_class %}{% endblock %}">

</body>
</html>
